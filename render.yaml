# Render Blueprint for the API. Postgres is hosted on Neon, so there is no database block.
services:
  - type: web
    name: wellness-streaks-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma generate --schema apps/api/prisma/schema.prisma
    # Apply pending migrations on every boot (idempotent), then start the API.
    startCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run start -w @wellness/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TIMEZONE
        value: Asia/Kolkata
